<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="@saklin_01">
  <meta name="description" content="Heart of Words - Pure Canvas Romantic Heart Animation">
  <title>Heart of Words | @saklin_01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background canvas for subtle starry glow -->
  <canvas id="bgCanvas"></canvas>

  <!-- Heart canvas where words trace the perimeter then cascade to fill the heart -->
  <canvas id="heartCanvas"></canvas>

  <script src="script.js"></script>
  <audio id="bgm" src="music.mp3" loop preload="auto"></audio>
  <script>
(function () {
  var a = document.getElementById('bgm');
  a.volume = 0.6;
  var events = ['click', 'touchend', 'pointerup', 'keydown'];
  function start() {
    a.play().then(function () {
      events.forEach(function (e) {
        window.removeEventListener(e, start, true);
      });
    }).catch(function () {});
  }
  a.play().catch(function () {});
  events.forEach(function (e) {
    window.addEventListener(e, start, true);
  });
})();
</script>
</body>
</html>
